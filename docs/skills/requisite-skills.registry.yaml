schema_version: "0.1"
registry_id: "mobiius.conversation-recovered-skills"
owner_repository: "git4emet/systemsNxXD"
recovery_rule: "Conversation descriptions are valid recovery sources; source code is additional evidence, not a prerequisite."
evidence_states:
  - conversation_recovered
  - specification_recovered
  - source_recovered
  - tests_present
  - implementation_tested
  - deployment_verified
canonical_coordinate_contract:
  current_point: "P_t"
  correlate_space: "C(P_t) = {P_1, ..., P_n}"
  avenue: "A_i = (P_t -> P_i)"
  flow:
    - current_point
    - resolve_correlate_space
    - enumerate_available_points
    - present_available_avenues
    - caller_selection
    - instantiate_selected_transition
    - record_new_point_and_script
    - continue
  absent_semantics:
    - priority
    - ranking
    - recommendation
    - preference
    - approval
    - denial
    - risk_score
    - trust_score
    - decisional_intensity
    - model_voting
    - agent_consensus
